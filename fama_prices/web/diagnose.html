<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>NuMIS Diagnose</title>
<style>
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       margin:0; padding:16px; background:#f6f7f5; color:#16211c}
  @media (prefers-color-scheme:dark){ body{background:#101513; color:#e8efea} }
  h1{font-size:18px; margin:0 0 4px}
  p.sub{margin:0 0 16px; color:#6b7a72; font-size:13px}
  .box{background:#fff; border:1px solid #dfe4e0; border-radius:10px; padding:12px; margin-bottom:10px}
  @media (prefers-color-scheme:dark){ .box{background:#182320; border-color:#26332e} }
  .ok{color:#1f6f4a; font-weight:700}
  .bad{color:#a5341a; font-weight:700}
  h2{font-size:14px; margin:0 0 6px}
  pre{white-space:pre-wrap; word-break:break-word; font-size:12px; margin:6px 0 0;
      background:rgba(127,127,127,.1); padding:8px; border-radius:6px; max-height:240px; overflow:auto}
  button{width:100%; min-height:46px; font-size:15px; font-weight:600; border-radius:10px;
         border:0; background:#1f6f4a; color:#fff; cursor:pointer; margin-top:10px}
</style>
</head>
<body>
<h1>NuMIS · Diagnose</h1>
<p class="sub">Prüft Schritt für Schritt, was die Datenbank an diesen Browser liefert.</p>
<div id="out"></div>
<button onclick="navigator.clipboard.writeText(document.getElementById('out').innerText)
                 .then(()=>alert('Bericht kopiert'))">Bericht kopieren</button>

<script>
const RPC   = "https://otumcdmymenwiliwzrhj.supabase.co/rest/v1/rpc/";
const KEY   = "sb_publishable_9jDrv-WthtnBd3SY7C3BOQ_fgcEwmOD";
const TOKEN = "numis-2026-08-r1-8f3ac21d";
const out = document.getElementById("out");

function box(titel, ok, zeilen){
  const d = document.createElement("div");
  d.className = "box";
  d.innerHTML = `<h2>${titel} <span class="${ok?'ok':'bad'}">${ok?'OK':'FEHLER'}</span></h2>` +
                zeilen.map(z=>`<div>${z}</div>`).join("");
  out.appendChild(d);
}
const pre = o => `<pre>${String(typeof o==="string"?o:JSON.stringify(o,null,1)).slice(0,1200)
                        .replace(/[&<]/g,c=>({"&":"&amp;","<":"&lt;"}[c]))}</pre>`;

async function schritt(name, body){
  const t0 = performance.now();
  try{
    const r = await fetch(RPC + name, {
      method:"POST",
      headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const txt = await r.text();
    const ms = Math.round(performance.now()-t0);
    let daten = null;
    try{ daten = JSON.parse(txt); }catch(e){}
    return {ok:r.ok, status:r.status, ms, txt, daten};
  }catch(e){
    return {ok:false, status:"—", ms:Math.round(performance.now()-t0),
            txt:e.name+": "+e.message, daten:null, netz:true};
  }
}

(async function(){
  // 0. Umgebung
  let ls = "nutzbar";
  try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); }
  catch(e){ ls = "BLOCKIERT ("+e.name+")"; }
  box("0 · Umgebung", ls === "nutzbar", [
    "Adresse: <b>" + location.protocol + "</b>" +
      (location.protocol === "file:" ? " – aus dem Dateisystem geöffnet" : ""),
    "Lokaler Speicher: <b>" + ls + "</b>",
    "Browser: " + navigator.userAgent.slice(0,110)
  ]);

  // 1. Freigabe
  const a = await schritt("numis_client_check", {p_token: TOKEN});
  box("1 · Freigabe der Fassung", a.ok && a.daten && a.daten.status === "ACTIVE", [
    "HTTP <b>" + a.status + "</b> nach " + a.ms + " ms",
    a.netz ? "Kein Netzwerkzugriff (CORS oder Verbindung): " + a.txt
           : "Antwort:" + pre(a.daten ?? a.txt)
  ]);

  // 2. Auswahllisten - hier liegt der gemeldete Fehler
  const b = await schritt("numis_filter_options", {p_token: TOKEN});
  const d = b.daten;
  const zaehl = k => (d && Array.isArray(d[k])) ? d[k].length : "FEHLT";
  box("2 · Auswahllisten", b.ok && d && zaehl("crops") > 0, [
    "HTTP <b>" + b.status + "</b> nach " + b.ms + " ms, " + b.txt.length + " Zeichen empfangen",
    "Typ der Antwort: <b>" + (Array.isArray(d) ? "Array (unerwartet!)" : typeof d) + "</b>",
    "Sorten: <b>"+zaehl("crops")+"</b> · Märkte: <b>"+zaehl("markets")+
      "</b> · Preisebenen: <b>"+zaehl("levels")+"</b> · Marktarten: <b>"+zaehl("sublevels")+
      "</b> · Güteklassen: <b>"+zaehl("grades")+"</b> · Einheiten: <b>"+zaehl("units")+
      "</b> · Status: <b>"+zaehl("statuses")+"</b> · Bundesstaaten: <b>"+zaehl("states")+
      "</b> · Warengruppen: <b>"+zaehl("categories")+"</b>",
    b.ok ? "Erste Sorte:" + pre(d && d.crops && d.crops[0]) : "Fehlertext:" + pre(b.txt)
  ]);

  // 3. Preisabruf
  const c = await schritt("numis_price_series", {p_token: TOKEN, p_from:"2026-08-01", p_to:"2026-08-15"});
  box("3 · Preisabruf", c.ok && Array.isArray(c.daten), [
    "HTTP <b>" + c.status + "</b> nach " + c.ms + " ms",
    "Zeilen: <b>" + (Array.isArray(c.daten) ? c.daten.length : "keine") + "</b>",
    c.ok ? "Erste Zeile:" + pre(Array.isArray(c.daten) ? c.daten[0] : null)
         : "Fehlertext:" + pre(c.txt)
  ]);
})();
</script>
</body>
</html>
